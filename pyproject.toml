# Development configuration only (ARCHITECTURE.md §0/§9, decision record
# 2026-08-23): GPI is a clone-and-run application — never installed, never
# imported. There is deliberately no build system, no [project.scripts], and
# no dynamic version; the single version authority is __version__.py at the
# repository root. Dependencies are declared here as documentation for
# contributors, installed directly (e.g. `python -m pip install pydantic
# pandas pyarrow`).

[project]
name = "globalpolicyinfra"
description = "An open-source infrastructure for cross-country public policy document collection, cleaning, extraction, and comparison."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Zhaotian Yang" }
]
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
    "pandas-stubs>=2.0",
    "types-requests>=2.31",
    "pre-commit>=3.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "conftest.py",
    "__version__.py",
    "cli.py",
    "core",
    "runtime",
    "store",
    "adapters",
    "extraction",
    "ontology",
    "agents",
    "evaluation",
]

# numpy >= 2.4 ships stubs using PEP 695 syntax (Python 3.12+), which cannot be
# parsed under python_version = 3.11. GPI never calls numpy directly (only via
# pandas), so skipping stub analysis there is safe. follow_imports_for_stubs is
# required or imports inside .pyi files (pandas-stubs) ignore the skip.
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
